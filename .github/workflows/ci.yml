name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Syntax check + smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax check (worker + edge adapters)
        run: |
          cp port80-worker.js           _syntax_worker.mjs
          cp api/probe.js               _syntax_vercel.mjs
          cp netlify/edge-functions/probe.js _syntax_netlify.mjs
          node --check _syntax_worker.mjs
          node --check _syntax_vercel.mjs
          node --check _syntax_netlify.mjs

      - name: Smoke test
        run: node scripts/smoke.mjs
